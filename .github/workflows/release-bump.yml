# Manually triggered workflow that bumps the app version, generates a
# CHANGELOG entry using Conventional Commits, and pushes a version tag to
# main.  The pushed tag automatically triggers release-build.yml.
#
# BRANCH PROTECTION NOTE
# If your main branch requires PRs (i.e. direct pushes are blocked), the
# default GITHUB_TOKEN cannot push.  In that case:
#   1. Create a Personal Access Token (PAT) with "repo" scope.
#   2. Store it as a repository secret named RELEASE_TOKEN.
#   3. Replace every occurrence of `secrets.GITHUB_TOKEN` below with
#      `secrets.RELEASE_TOKEN`.

name: Release Bump

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Semver bump type'
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write   # needed to push commit + tag

jobs:
  bump:
    runs-on: ubuntu-22.04

    steps:
      # ── 1. Checkout with full history so conventional-changelog can read all commits ──
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Node / pnpm setup ──────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      # ── 3. Compute next version ───────────────────────────────────────────────────
      - name: Compute next version
        id: semver
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "${{ inputs.version_type }}" in
            major) NEXT="$((MAJOR + 1)).0.0" ;;
            minor) NEXT="${MAJOR}.$((MINOR + 1)).0" ;;
            patch) NEXT="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
          esac
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "next=$NEXT"       >> "$GITHUB_OUTPUT"
          echo "tag=v$NEXT"       >> "$GITHUB_OUTPUT"
          echo "Bumping $CURRENT → $NEXT"

      # ── 4. Generate / update CHANGELOG.md ────────────────────────────────────────
      - name: Generate changelog
        run: |
          npx --yes conventional-changelog-cli@latest \
            -p angular \
            -i CHANGELOG.md \
            -s \
            --release-count 0

      # ── 5. Bump version in package.json ──────────────────────────────────────────
      - name: Bump package.json version
        run: |
          npm version "${{ steps.semver.outputs.next }}" --no-git-tag-version

      # ── 6. Bump version in src-tauri/Cargo.toml ──────────────────────────────────
      - name: Bump Cargo.toml version
        run: |
          NEXT="${{ steps.semver.outputs.next }}"
          # Replace the version field in the [package] section only
          sed -i "0,/^version = \"[^\"]*\"/s//version = \"$NEXT\"/" src-tauri/Cargo.toml

      # ── 7. Bump version in src-tauri/tauri.conf.json ─────────────────────────────
      - name: Bump tauri.conf.json version
        run: |
          NEXT="${{ steps.semver.outputs.next }}"
          jq --arg v "$NEXT" '.version = $v' src-tauri/tauri.conf.json > /tmp/tauri.conf.tmp
          mv /tmp/tauri.conf.tmp src-tauri/tauri.conf.json

      # ── 8. Commit and tag ─────────────────────────────────────────────────────────
      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit version bump
        run: |
          git add package.json src-tauri/Cargo.toml src-tauri/tauri.conf.json CHANGELOG.md
          git commit -m "chore: bump version to ${{ steps.semver.outputs.tag }}"

      - name: Create and push tag
        run: |
          git tag "${{ steps.semver.outputs.tag }}"
          git push origin main --follow-tags
